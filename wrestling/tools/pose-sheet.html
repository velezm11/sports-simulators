<!doctype html><html><head><meta charset="utf-8"><title>pose check</title><style>body{margin:0;background:#eef2f6;font-family:system-ui}svg{display:block;width:900px;height:500px;background:#f8fafc;border-bottom:1px solid #ccc}h3{margin:6px 12px;font-size:14px}</style></head><body><div id="root"></div>
<script type="module">
import {drawWrestler,WRESTLERS} from "../ui/figures.js";
import * as P from "../ui/poses.js";
const root=document.getElementById("root");
const only=new URLSearchParams(location.search).get("f");
for(const [name,frame] of Object.entries(P)){ if(only&&!only.split(",").includes(name))continue;
  const h=document.createElement("h3");h.textContent=name;root.appendChild(h);
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");svg.setAttribute("viewBox","0 0 900 500");
  const mat=document.createElementNS("http://www.w3.org/2000/svg","line");mat.setAttribute("x1",0);mat.setAttribute("x2",900);mat.setAttribute("y1",400);mat.setAttribute("y2",400);mat.setAttribute("stroke","#bbb");svg.appendChild(mat);
  svg.appendChild(drawWrestler(frame.green,WRESTLERS.green,{facing:"left"}));
  svg.appendChild(drawWrestler(frame.red,WRESTLERS.red,{facing:"right"}));
  root.appendChild(svg);
}
</script></body></html>
